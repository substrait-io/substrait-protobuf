name: Release Golang

on:
  schedule:
    # Spec release happen: 2AM on Sunday UTC
    # Schedule Protobuf release for: 3AM on Sunday UTC
    # TODO: instead of a soft temporal link between spec and protobuf releases,
    #   implement a hard link where a spec release triggers a protobuf release.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    # Allow manual triggering

# avoid concurrent execution of release workflows
concurrency:
  group: release
  # avoid cancelling in-progress release run
  cancel-in-progress: false

jobs:
  check-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_KEY }}

      - name: Checkout substrait-protobuf
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for tags
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: recursive

      - name: Retrieve latest Substrait release
        id: latest_substrait_release
        run: |
          # This fetches the latest release
          gh release view --repo substrait-io/substrait --json tagName >> $GITHUB_OUTPUT

      - name: Get bot user ID
        id: bot-user-id
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Execute generate-go
        run: |
          VERSION=${{ steps.latest_substrait_release.outputs.tagName }}
          ./generate-go.sh $VERSION
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_EMAIL: "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          GIT_COMMITTER_EMAIL: "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

